
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1 class="logo">ShopEase</h1>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#products">Products</a>
                <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
                <a href="#account">Account</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero" id="home">
            <div>
                <h2>Welcome to ShopEase!</h2>
                <p>Your favorite products, just one click away.</p>
                <a href="#products" class="shop-button">Shop Now</a>
            </div>
        </section>

        <section class="products-section" id="products">
            <h2>Our Products</h2>

            <div class="search-box">
                <input
                    type="text"
                    id="search"
                    placeholder="Search products..."
                >
            </div>

            <div id="product-list" class="product-grid">
                <p>Loading products...</p>
            </div>
        </section>

        <section class="cart-section" id="cart">
            <h2>Shopping Cart</h2>
            <div id="cart-items"></div>
            <h3>Total: ₱<span id="cart-total">0.00</span></h3>
            <button id="checkout-button">Checkout</button>
        </section>

        <section class="account-section" id="account">
            <h2>My Account</h2>

            <div class="account-forms">
                <form id="login-form">
                    <h3>Login</h3>
                    <input
                        type="email"
                        id="login-email"
                        placeholder="Email"
                        required
                    >
                    <input
                        type="password"
                        id="login-password"
                        placeholder="Password"
                        required
                    >
                    <button type="submit">Login</button>
                </form>

                <form id="register-form">
                    <h3>Create Account</h3>
                    <input
                        type="text"
                        id="register-name"
                        placeholder="Full Name"
                        required
                    >
                    <input
                        type="email"
                        id="register-email"
                        placeholder="Email"
                        required
                    >
                    <input
                        type="password"
                        id="register-password"
                        placeholder="Password"
                        required
                    >
                    <button type="submit">Register</button>
                </form>
            </div>

            <button id="logout-button">Logout</button>
            <p id="account-message"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ShopEase. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
